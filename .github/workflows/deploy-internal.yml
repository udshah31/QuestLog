name: Deploy — Google Play Internal Track

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-play-store
  cancel-in-progress: false

jobs:
  deploy-internal:
    name: Build AAB & Release to Play Console
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job-level so the steps' `if:` can see them — a step's own `env:` isn't visible to its `if:`.
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      PLAY_CONFIG_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Quality Gate (Unit Tests)
        run: ./gradlew testDebugUnitTest :shared:desktopTest --no-daemon

      - name: Decode Release Keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build Android App Bundle (AAB)
        env:
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
          UNLOCK_PROXY_URL: ${{ secrets.UNLOCK_PROXY_URL }}
          ANDROID_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && format('{0}/release.keystore', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Upload to Google Play Internal Track
        # Play rejects unsigned bundles, so both secrets are required.
        if: env.PLAY_CONFIG_JSON != '' && env.KEYSTORE_BASE64 != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.udaysah.questlog
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
          # `draft` until the app's first release is live; a never-published app rejects
          # anything else. Switch to `completed` after that.
          status: draft
          changesNotSentForReview: true

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v7
        with:
          name: questlog-release-aab
          path: app/build/outputs/bundle/release/*.aab
